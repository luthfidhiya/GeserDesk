[workspace]
resolver = "2"
members = [
    "crates/geserdesk-proto",
    "crates/geserdesk-platform",
    "crates/geserdesk-tls",
    "crates/geserdesk-server",
    "crates/geserdesk-client",
    "crates/geserdesk-app",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/lytcherdev/geserdesk"
authors = ["GeserDesk contributors"]

[workspace.dependencies]
geserdesk-proto = { path = "crates/geserdesk-proto" }
geserdesk-platform = { path = "crates/geserdesk-platform" }
geserdesk-tls = { path = "crates/geserdesk-tls" }
geserdesk-server = { path = "crates/geserdesk-server" }
geserdesk-client = { path = "crates/geserdesk-client" }
geserdesk-app = { path = "crates/geserdesk-app" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "5"

tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"

[profile.release]
lto = "thin"
strip = true
