[package]
name = "geserdesk-app"
description = "GeserDesk application layer: run the client or the server, settings, status and log. No GUI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
geserdesk-tls.workspace = true
geserdesk-platform.workspace = true
geserdesk-server.workspace = true
geserdesk-client = { workspace = true, features = ["inject"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
