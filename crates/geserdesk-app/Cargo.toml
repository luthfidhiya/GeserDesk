# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "geserdesk-app"
description = "GeserDesk application layer: run the client or the server, settings, status and log. No GUI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Real input injection for clients (needs libxdo on Linux). Off for a headless CLI.
default = []
inject = ["geserdesk-client/inject"]

[dependencies]
geserdesk-tls.workspace = true
geserdesk-platform.workspace = true
geserdesk-server.workspace = true
geserdesk-client.workspace = true
geserdesk-clipboard.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
chrono.workspace = true
serde_json.workspace = true
interprocess.workspace = true
getrandom.workspace = true
sha2.workspace = true
thiserror.workspace = true
anyhow.workspace = true
geserdesk-proto.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
