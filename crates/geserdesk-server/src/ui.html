<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeserDesk · Atur Layar</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #d9dde5;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --grid: #e6e9ef;
    --c0: #3b82f6; --c1: #10b981; --c2: #f59e0b; --c3: #ef4444; --c4: #8b5cf6; --c5: #14b8a6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --panel: #1a202b; --ink: #e8ecf3; --muted: #94a0b4; --line: #2c3544;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --grid: #232b38;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #stage { padding: 8px; }
  svg { width: 100%; height: 56vh; min-height: 280px; display: block; touch-action: none; user-select: none; }
  .hint { color: var(--muted); font-size: 13px; padding: 4px 8px 8px; }
  .mon { stroke-width: 2; vector-effect: non-scaling-stroke; fill-opacity: .22; cursor: grab; }
  .machine.sel .mon { stroke-width: 4; fill-opacity: .34; }
  .machine.off .mon { stroke-dasharray: 7 5; fill-opacity: .1; }
  .machine.bad .mon { stroke: var(--bad) !important; fill: var(--bad) !important; }
  .lbl { fill: var(--ink); pointer-events: none; font-weight: 600; }
  .sublbl { fill: var(--muted); pointer-events: none; }
  .gridline { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .list { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
  .row.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .row h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .chip { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--grid); color: var(--muted); font-weight: 500; }
  .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .meta.warn { color: var(--warn); }
  .xy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { font-size: 12px; color: var(--muted); display: block; }
  input[type=number] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
                       background: var(--bg); color: var(--ink); font: inherit; }
  .actions { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #msg { min-height: 1.4em; font-size: 13.5px; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--bad); } #msg.info { color: var(--muted); }
  kbd { background: var(--grid); border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>GeserDesk · Atur Layar</h1>
  <span class="sub" id="cfg"></span>
</header>
<main>
  <section class="card" id="stage">
    <svg id="svg" role="img" aria-label="Susunan layar"></svg>
    <div class="hint">Seret kotak untuk menggeser komputer. Kotak menempel otomatis ke tepi layar lain.
      Pilih satu lalu pakai <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> (10&nbsp;px) atau <kbd>Shift</kbd>+panah (1&nbsp;px).
      Kursor hanya bisa pindah di bagian tepi yang benar-benar bersentuhan.</div>
  </section>
  <aside>
    <div class="card list" id="list"></div>
    <div class="card actions">
      <div class="btns">
        <button class="primary" id="save">Simpan &amp; terapkan</button>
        <button id="revert">Batalkan</button>
        <button id="auto">Susun otomatis</button>
      </div>
      <div id="msg" class="info"></div>
    </div>
  </aside>
</main>
<script>
"use strict";
const COLORS = ["--c0","--c1","--c2","--c3","--c4","--c5"];
const NS = "http://www.w3.org/2000/svg";
let state = null;          // last server state
let draft = {};            // name -> {x, y} being edited
let dirty = false;
let selected = null;
let drag = null;
let overlapShown = false;

const $ = (id) => document.getElementById(id);
const svg = $("svg");

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function html(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
}
function color(i) { return `var(${COLORS[i % COLORS.length]})`; }
function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = kind || "info"; }

// ---- geometry ----------------------------------------------------------------
function monitorsOf(s) { return s.monitors; }
function deskRects(s, o) {
  return monitorsOf(s).map((m) => ({ x: m.x + o.x, y: m.y + o.y, w: m.w, h: m.h }));
}
function union(rects) {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const m of rects) { l = Math.min(l, m.x); t = Math.min(t, m.y); r = Math.max(r, m.x + m.w); b = Math.max(b, m.y + m.h); }
  return { x: l, y: t, w: r - l, h: b - t };
}
function hit(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
function overlapping() {
  const bad = new Set();
  const all = state.screens.map((s) => [s.name, deskRects(s, draft[s.name])]);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    if (all[i][1].some((a) => all[j][1].some((b) => hit(a, b)))) { bad.add(all[i][0]); bad.add(all[j][0]); }
  }
  return bad;
}
// Which machines touch `name` along a shared stretch of edge, and on which side.
function neighbours(name) {
  const me = deskRects(state.screens.find((s) => s.name === name), draft[name]);
  const found = new Map();
  const overlap = (a0, a1, b0, b1) => Math.min(a1, b1) - Math.max(a0, b0) > 0;
  for (const s of state.screens) {
    if (s.name === name) continue;
    for (const b of deskRects(s, draft[s.name])) for (const a of me) {
      let side = null;
      if (overlap(a.y, a.y + a.h, b.y, b.y + b.h)) { if (a.x + a.w === b.x) side = "kanan"; else if (b.x + b.w === a.x) side = "kiri"; }
      if (!side && overlap(a.x, a.x + a.w, b.x, b.x + b.w)) { if (a.y + a.h === b.y) side = "bawah"; else if (b.y + b.h === a.y) side = "atas"; }
      if (side) found.set(s.name + side, `${s.name} (${side})`);
    }
  }
  return [...found.values()];
}

// Move `o` so this machine's monitors touch/align with the others' within `thr`.
function snap(name, o, thr) {
  const me = deskRects(state.screens.find((s) => s.name === name), o);
  const others = state.screens.filter((s) => s.name !== name).flatMap((s) => deskRects(s, draft[s.name]));
  let bestX = null, bestY = null;
  const consider = (cur, d) => (Math.abs(d) <= thr && (cur === null || Math.abs(d) < Math.abs(cur))) ? d : cur;
  for (const a of me) for (const b of others) {
    for (const d of [b.x + b.w - a.x, b.x - (a.x + a.w), b.x - a.x, b.x + b.w - (a.x + a.w)]) bestX = consider(bestX, d);
    for (const d of [b.y + b.h - a.y, b.y - (a.y + a.h), b.y - a.y, b.y + b.h - (a.y + a.h)]) bestY = consider(bestY, d);
  }
  return { x: o.x + (bestX ?? 0), y: o.y + (bestY ?? 0) };
}

// ---- data --------------------------------------------------------------------
async function load() {
  const r = await fetch("/api/state", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const next = await r.json();
  const prevDraft = draft;
  state = next;
  draft = {};
  for (const s of state.screens) {
    draft[s.name] = (dirty && prevDraft[s.name]) ? prevDraft[s.name] : { x: s.origin.x, y: s.origin.y };
  }
  if (!selected || !draft[selected]) selected = state.local;
  $("cfg").textContent = state.config_path ? "Disimpan ke " + state.config_path : "Config tidak punya berkas: perubahan tidak disimpan";
  render();
}

// ---- drawing -----------------------------------------------------------------
function render() {
  if (!state) return;
  const bad = overlapping();
  const rects = state.screens.flatMap((s) => deskRects(s, draft[s.name]));
  const u = union(rects);
  // Generous margin so a machine can be dragged to any side of the others.
  // While dragging the view is frozen, otherwise it would rescale under the
  // pointer and the movement would run away.
  const pad = Math.max(u.w * 0.25, u.h * 0.5) + 200;
  const vb = drag ? drag.vb : { x: u.x - pad, y: u.y - pad, w: u.w + pad * 2, h: u.h + pad * 2 };
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.replaceChildren();

  // faint grid every 1000 desk px
  const step = 1000;
  for (let gx = Math.ceil(vb.x / step) * step; gx < vb.x + vb.w; gx += step)
    svg.append(el("line", { class: "gridline", x1: gx, y1: vb.y, x2: gx, y2: vb.y + vb.h }));
  for (let gy = Math.ceil(vb.y / step) * step; gy < vb.y + vb.h; gy += step)
    svg.append(el("line", { class: "gridline", x1: vb.x, y1: gy, x2: vb.x + vb.w, y2: gy }));

  const fs = vb.w / 60;
  state.screens.forEach((s, i) => {
    const g = el("g", { class: "machine" + (s.name === selected ? " sel" : "") + (s.connected ? "" : " off") + (bad.has(s.name) ? " bad" : "") });
    g.dataset.name = s.name;
    const c = color(i);
    deskRects(s, draft[s.name]).forEach((m, k) => {
      g.append(el("rect", { class: "mon", x: m.x, y: m.y, width: m.w, height: m.h, rx: fs / 3, fill: c, stroke: c }));
      g.append(el("text", { class: "sublbl", x: m.x + fs * 0.6, y: m.y + m.h - fs * 0.6, "font-size": fs * 0.8 },
        `${m.w}×${m.h}` + (s.monitors.length > 1 ? ` · #${k + 1}` : "")));
    });
    const first = deskRects(s, draft[s.name])[0];
    g.append(el("text", { class: "lbl", x: first.x + fs * 0.6, y: first.y + fs * 1.5, "font-size": fs * 1.15 },
      s.name + (s.local ? " (server)" : "")));
    g.addEventListener("pointerdown", (ev) => startDrag(ev, s.name, vb));
    svg.append(g);
  });

  renderList(bad);
  $("save").disabled = bad.size > 0 || !dirty;
  $("revert").disabled = !dirty;
  if (bad.size) { say("Ada layar yang saling menimpa (merah). Geser agar tidak bertumpuk.", "err"); overlapShown = true; }
  else if (overlapShown) { say("", "info"); overlapShown = false; }
}

function neighbourLine(name) {
  const n = neighbours(name);
  if (n.length) return html("div", { class: "meta" }, "Bersebelahan: " + n.join(", "));
  return html("div", { class: "meta warn" }, "Tidak menyentuh layar lain: kursor tidak bisa pindah ke sini.");
}

function renderList(bad) {
  const list = $("list");
  list.replaceChildren();
  state.screens.forEach((s, i) => {
    const o = draft[s.name];
    const sizes = s.monitors.map((m) => `${m.w}×${m.h}`).join(", ");
    const meta = `${s.monitors.length} monitor: ${sizes}` +
      (s.placeholder ? " (perkiraan, belum pernah terhubung)" : "");
    const mk = (axis) => {
      const inp = html("input", { type: "number", step: "10", value: String(o[axis]), "aria-label": `${s.name} ${axis.toUpperCase()}` });
      inp.onchange = () => { const v = parseInt(inp.value, 10); if (Number.isFinite(v)) { draft[s.name][axis] = v; dirty = true; render(); } };
      return html("div", {}, html("label", {}, axis.toUpperCase()), inp);
    };
    const row = html("div", { class: "row" + (s.name === selected ? " sel" : "") },
      html("h3", {},
        Object.assign(html("span", { class: "chip" }), { style: `background:${color(i)}` }),
        document.createTextNode(s.name),
        s.local ? html("span", { class: "tag" }, "server") : document.createTextNode(""),
        Object.assign(html("span", { class: "dot" + (s.connected ? " on" : ""), title: s.connected ? "terhubung" : "tidak terhubung" }), {})),
      html("div", { class: "meta" }, (s.connected ? "Terhubung · " : "Tidak terhubung · ") + meta),
      neighbourLine(s.name),
      html("div", { class: "xy" }, mk("x"), mk("y")));
    row.onclick = (e) => { if (e.target.tagName !== "INPUT") { selected = s.name; render(); } };
    list.append(row);
  });
}

// ---- dragging ----------------------------------------------------------------
function svgPoint(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function startDrag(ev, name, vb) {
  ev.preventDefault();
  selected = name;
  const p = svgPoint(ev);
  drag = { name, startPt: p, start: { ...draft[name] }, vb };
  svg.setPointerCapture(ev.pointerId);
  render();
}
svg.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const p = svgPoint(ev);
  const raw = { x: Math.round(drag.start.x + p.x - drag.startPt.x), y: Math.round(drag.start.y + p.y - drag.startPt.y) };
  const pxPerUnit = svg.getBoundingClientRect().width / drag.vb.w;
  draft[drag.name] = ev.altKey ? raw : snap(drag.name, raw, 24 / pxPerUnit);
  dirty = true;
  render();
});
function endDrag() { drag = null; }
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

window.addEventListener("keydown", (ev) => {
  if (!state || !selected || ev.target.tagName === "INPUT") return;
  const d = ev.shiftKey ? 1 : 10;
  const m = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[ev.key];
  if (!m) return;
  ev.preventDefault();
  draft[selected] = { x: draft[selected].x + m[0], y: draft[selected].y + m[1] };
  dirty = true;
  render();
});

// ---- buttons -----------------------------------------------------------------
$("save").onclick = async () => {
  say("Menyimpan…", "info");
  try {
    const r = await fetch("/api/layout", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ positions: draft }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { say(j.error || ("Gagal (HTTP " + r.status + ")"), "err"); return; }
    dirty = false;
    await load();
    say(j.saved ? "Tersimpan ke config dan langsung berlaku." : "Berlaku sekarang (config tidak punya berkas, tidak disimpan).", "ok");
  } catch (e) { say("Gagal menghubungi server: " + e.message, "err"); }
};
$("revert").onclick = async () => { dirty = false; await load(); say("Perubahan dibatalkan.", "info"); };
$("auto").onclick = () => {
  // Server first, then the others, in a row; vertically centred on the server.
  const order = [...state.screens].sort((a, b) => (b.local - a.local));
  let x = 0;
  const heights = order.map((s) => union(deskRects(s, { x: 0, y: 0 })).h);
  const base = heights[0];
  order.forEach((s, i) => {
    const u = union(deskRects(s, { x: 0, y: 0 }));
    draft[s.name] = { x: x - u.x, y: Math.round((base - u.h) / 2) - u.y };
    x += u.w;
  });
  dirty = true; render(); say("Disusun berjajar. Klik Simpan untuk menerapkan.", "info");
};

load().catch((e) => say("Gagal memuat: " + e.message, "err"));
setInterval(() => { if (!drag) load().catch(() => {}); }, 2000);
</script>
</body>
</html>
